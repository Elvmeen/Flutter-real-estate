name: dreamhome_real_estate
description: DreamHome - Your comprehensive real estate marketplace

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  sizer: ^2.0.15
  provider: ^6.0.0
  http: ^1.1.0
  flutter_riverpod: ^2.4.0
  json_annotation: ^4.8.1
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  url_launcher: ^6.1.14
  google_maps_flutter: ^2.5.0
  location: ^5.0.3
  geolocator: ^10.0.1
  flutter_native_splash: ^2.3.2
  # New dependencies for DreamHome features
  shared_preferences: ^2.2.2
  video_player: ^2.8.1
  photo_view: ^0.14.0
  carousel_slider: ^4.2.1
  flutter_local_notifications: ^16.3.0
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.19.0
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  image_picker: ^1.0.4
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/dtt_banner/hdpi/
    - assets/images/dtt_banner/ldpi/
    - assets/images/dtt_banner/mdpi/
    - assets/images/dtt_banner/xhdpi/
    - assets/images/dtt_banner/xxhdpi/
    - assets/images/dtt_banner/xxxhdpi/

  fonts:
    - family: GothamSSm
      fonts:
        - asset: assets/fonts/Gotham SSm/GothamSSm-Black.otf
        - asset: assets/fonts/Gotham SSm/GothamSSm-BlackItalic.otf
        - asset: assets/fonts/Gotham SSm/GothamSSm-Bold.otf
        - asset: assets/fonts/Gotham SSm/GothamSSm-Book.otf
        - asset: assets/fonts/Gotham SSm/GothamSSm-Light.otf
        - asset: assets/fonts/Gotham SSm/GothamSSm-Medium.otf

  uses-material-design: true

flutter_native_splash:
  image: "assets/images/launcher_icon.png"
  color: "#E65541"
  android_12:
    image: "assets/images/launcher_icon.png"
    color: "#E65541"